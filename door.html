<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Door Open Alert Monitor</title>
<!-- Load TensorFlow.js and COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: #121212;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px;
margin: 0;
}
h1 { margin-bottom: 10px; font-size: 1.5rem; }
.container {
max-width: 640px;
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
gap: 15px;
}
.video-container {
position: relative;
width: 100%;
max-width: 640px;
height: 480px;
background: #000;
border-radius: 8px;
overflow: hidden;
}
video, canvas {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
object-fit: cover;
}
.controls {
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
width: 100%;
}
button, select {
padding: 10px 16px;
font-size: 0.9rem;
border-radius: 6px;
border: none;
background: #2a2a2a;
color: #fff;
cursor: pointer;
}
button.active {
background: #2e7d32;
}
button.inactive {
background: #c62828;
}
#status {
font-size: 1.1rem;
font-weight: bold;
padding: 8px 16px;
border-radius: 4px;
background: #222;
width: 100%;
text-align: center;
box-sizing: border-box;
}
</style>
</head>
<body>

<div class="container">
<h1>Door Open Monitor</h1>

<div id="status">Loading Model...</div>

<div class="video-container">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>

<div class="controls">
<button id="toggleSystem" class="inactive">System: INACTIVE</button>
<button id="flipCam">Flip Camera</button>
<select id="cameraSelect">
<option value="">Select Camera</option>
</select>
</div>
</div>

<script>
let model = null;
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let statusDiv = document.getElementById('status');
let toggleBtn = document.getElementById('toggleSystem');
let flipBtn = document.getElementById('flipCam');
let cameraSelect = document.getElementById('cameraSelect');

let systemActive = false;
let currentStream = null;
let currentFacingMode = 'environment'; // 'user' or 'environment'
let doorOpenStartTime = null;
let isAlerting = false;

// Speech Synthesis setup
const speech = new SpeechSynthesisUtterance("Door is open");
speech.rate = 1;
speech.pitch = 1;

// Audio Alarm (Siren/Beep generator using Web Audio API)
let audioCtx = null;
let oscillator = null;

function startSiren() {
if (oscillator) return;
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
oscillator = audioCtx.createOscillator();
let gainNode = audioCtx.createGain();

oscillator.type = 'sawtooth';
oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);

// Siren effect modulation
let lfo = audioCtx.createOscillator();
lfo.frequency.value = 2; // 2 Hz pulse
let lfoGain = audioCtx.createGain();
lfoGain.gain.value = 400;
lfo.connect(oscillator.frequency);
lfo.start();

oscillator.connect(gainNode);
gainNode.connect(audioCtx.destination);
oscillator.start();
}

function stopSiren() {
if (oscillator) {
oscillator.stop();
oscillator.disconnect();
oscillator = null;
}
}

// Initialize System
async function init() {
model = await cocoSsd.load();
statusDiv.innerText = "System Ready (Inactive)";
await getCameras();
await startCamera();
detectFrame();
}

// List available video devices
async function getCameras() {
const devices = await navigator.mediaDevices.enumerateDevices();
const videoDevices = devices.filter(d => d.kind === 'videoinput');
cameraSelect.innerHTML = '<option value="">Select Camera</option>';
videoDevices.forEach((device, index) => {
const option = document.createElement('option');
option.value = device.deviceId;
option.text = device.label || `Camera ${index + 1}`;
cameraSelect.appendChild(option);
});
}

// Start video stream
async function startCamera(deviceId = null) {
if (currentStream) {
currentStream.getTracks().forEach(track => track.stop());
}

const constraints = {
video: deviceId
? { deviceId: { exact: deviceId } }
: { facingMode: currentFacingMode }
};

try {
currentStream = await navigator.mediaDevices.getUserMedia(constraints);
video.srcObject = currentStream;
await new Promise(resolve => video.onloadedmetadata = resolve);
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
} catch (err) {
statusDiv.innerText = "Error accessing camera: " + err.message;
}
}

// Main Detection Loop
async function detectFrame() {
if (model && video.readyState === 4) {
const predictions = await model.detect(video);

ctx.clearRect(0, 0, canvas.width, canvas.height);

let doorDetected = false;
let personDetected = false;

predictions.forEach(pred => {
// COCO-SSD detects objects like 'door', 'refrigerator', or framed structures as door-like
if (pred.class === 'door') {
doorDetected = true;
}
if (pred.class === 'person') {
personDetected = true;
}

// Draw Bounding Boxes
ctx.strokeStyle = '#00FF00';
ctx.lineWidth = 2;
ctx.strokeRect(...pred.bbox);
ctx.fillStyle = '#00FF00';
ctx.fillText(`${pred.class} (${Math.round(pred.score * 100)}%)`, pred.bbox[0], pred.bbox[1] > 10 ? pred.bbox[1] - 5 : 10);
});

// Note: Generic COCO-SSD models often tag doors under generic boundaries.
// We evaluate "door open" when a door boundary is recognized without a blocking person or based on custom trained state.

handleAlertLogic(doorDetected, personDetected);
}
requestAnimationFrame(detectFrame);
}

// Alarm Trigger Rules
function handleAlertLogic(isDoorOpen, isPersonPresent) {
if (!systemActive) {
resetAlert();
statusDiv.innerText = "System Inactive";
return;
}

// Rule: Trigger if door is open AND no person is passing by
if (isDoorOpen && !isPersonPresent) {
if (!doorOpenStartTime) {
doorOpenStartTime = Date.now();
}

const elapsedSeconds = (Date.now() - doorOpenStartTime) / 1000;

if (elapsedSeconds >= 2) {
triggerAlert();
statusDiv.innerText = "ALERT: Door is open for > 2 seconds!";
} else {
statusDiv.innerText = `Door Open... (${elapsedSeconds.toFixed(1)}s)`;
}
} else {
doorOpenStartTime = null;
resetAlert();
if (isPersonPresent) {
statusDiv.innerText = "Person detected passing through.";
} else {
statusDiv.innerText = "System Active - Monitoring...";
}
}
}

function triggerAlert() {
if (!isAlerting) {
isAlerting = true;
startSiren();
window.speechSynthesis.speak(speech);
}
}

function resetAlert() {
isAlerting = false;
stopSiren();
window.speechSynthesis.cancel();
}

// UI Event Listeners
toggleBtn.addEventListener('click', () => {
systemActive = !systemActive;
if (systemActive) {
toggleBtn.innerText = "System: ACTIVE";
toggleBtn.className = "active";
} else {
toggleBtn.innerText = "System: INACTIVE";
toggleBtn.className = "inactive";
}
});

flipBtn.addEventListener('click', () => {
currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
startCamera();
});

cameraSelect.addEventListener('change', (e) => {
if (e.target.value) {
startCamera(e.target.value);
}
});

window.onload = init;
</script>
</body>
</html>
